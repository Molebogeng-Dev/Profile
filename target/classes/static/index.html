<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic 3D Web Profile</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fullscreen Interactive Canvas: Starfield, Gravity & Supernova Engine -->
  <canvas id="starfield-canvas"></canvas>

  <!-- Deep Space Atmosphere Vignette -->
  <div class="space-vignette"></div>

  <!-- Central Planet Stage (Exact Cartesian 0,0 Center) -->
  <div class="planet-stage" id="planet-stage" title="Click and drag to rotate the planet">
    <div class="atmosphere-halo"></div>
    <div class="orbit-reticle"></div>
    <canvas id="planet-canvas"></canvas>
  </div>

  <!-- 3D Orbiting Satellite Moons System -->
  <div class="orbital-system" id="orbital-system" aria-label="Orbiting satellite profiles"></div>

  <!-- Cosmic Glassmorphism Profile Modal -->
  <div id="cosmic-modal" class="cosmic-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog-window">
      <div class="modal-hud-header">
        <div class="modal-title-group">
          <span class="system-tag">// PROFILE SATELLITE INTERFACE</span>
          <div class="title-row">
            <h2 id="modal-title">Satellite</h2>
            <span id="modal-badge" class="modal-badge">Network</span>
          </div>
        </div>
        <div class="modal-header-actions">
          <a id="modal-external-link" href="#" target="_blank" rel="noopener noreferrer" class="modal-header-link" title="Launch External">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3m-2 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7z"/></svg>
          </a>
          <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-content-scroll" id="modal-body">
        <!-- Dynamically injected card & iframe preview -->
      </div>
    </div>
  </div>

  <!-- Supernova Blast Toast Notification (Fires after 2-second dwell) -->
  <div id="supernova-alert" class="supernova-alert">
    ⚡ SUPERNOVA DETONATED // STELLAR REBIRTH INITIATED
  </div>

  <!-- Scripts -->
  <script src="js/stars.js"></script>
  <script src="js/planet.js"></script>
  <script src="js/moons.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
